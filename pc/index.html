<main>
 <header><div class="ttl"><b>LA HORDA</b><small>PANEL DE FINANZAS</small></div>
  <div class="clk"><div id="clk">--:--</div><div id="dt"></div><div id="wx"></div></div></header>

  <div class="box"><h2>CUENTAS Y FONDOS</h2><div id="sa"></div></div>

 </section>
 <footer>
  <button class="btn on" id="b0"><i>X</i>CUENTAS</button>
  <button class="btn" id="b1"><i>START</i>JUEGOS</button>
  <button class="btn" id="b2"><i>Y</i>ESCRITORIO</button>

 </footer>
</main>
<div id="ov" hidden><div class="obar"><span>CUENTAS Y PENDIENTES</span><span>B = VOLVER</span></div><iframe id="fr"></iframe></div>
<script>

/* ---------- reloj y clima ---------- */

 for(let r=0;r<h;r++)for(let c=0;c<w;c++){const ch=gr[r][c];if(ch==='.'||ch===undefined)continue;let col=cB;
  if(ch==='e')col=cE;else if(ch==='v')col=cE;else if(ch==='f')col=hsl(55,100,85);else{const n=gr[r][c+ld];if(n==='.'||n===undefined)col=cR}

  const c=hsl(lerp(h,h+(dusk>.2?-35:28),t),lerp(60,88,t),lerp(5+day*10,17+day*22+dusk*10,t*t));R(0,y,W,y2-y,c);
  if(prev&&y2-y>1){for(let x=0;x<W;x+=2)R(x,y,1,1,prev);for(let x=1;x<W;x+=2)R(x,y+1,1,1,prev)}prev=c}
 const ns=Math.round(120*Math.max(0,1-day*1.6));for(let i=0;i<ns;i++){const x=rnd()*W,y=rnd()*78;R(x,y,1,1,rnd()<.2?hsl(h2,100,80):'#e8f4ff');if(rnd()<.06){R(x-1,y,3,1,'#fff');R(x,y-1,1,3,'#fff')}}
 const CX=190,CY=36,r=18,sun=day>.18||dusk>.3;disc(CX,CY,r+11,sun?hsl(40,100,60):hsl(h,60,70),.07);disc(CX,CY,r+6,sun?hsl(40,100,60):hsl(h,60,70),.12);
 for(let dy=-r;dy<=r;dy++){if(dy>3&&(dy%5)<Math.floor(dy/5)+1)continue;const hw=Math.floor(Math.sqrt(r*r-dy*dy+.5)),t=(dy+r)/(2*r);
  R(CX-hw,CY+dy,hw*2+1,1,sun?hsl(lerp(52,-35,t),100,lerp(72,58,t)):hsl(h,28,lerp(93,72,t)))}

 const cl=p.code>=1?(p.code<=3?3:7):0;for(let i=0;i<cl;i++){const x=rnd()*W,y=14+rnd()*50,w=22+rnd()*30,c=hsl(h,30,lerp(10,38,day*.7+.1));R(x,y,w,3,c);R(x+4,y-2,w-10,2,c);R(x+8,y-4,w-22,2,c)}

 g.save();g.translate(0,-12);const wl=lerp(.1,.42,night);
 function city(base,hmin,hmax,wmin,wmax,col,rim,signs){let x=-6;while(x<W){const w=wmin+(rnd()*(wmax-wmin)|0),hh=hmin+(rnd()*(hmax-hmin)|0);R(x,base-hh,w,hh,col);R(x+w-1,base-hh,1,hh,rim);
   if(rnd()<.4)R(x+(w>>1),base-hh-7,1,7,col);if(rnd()<.3)R(x+1,base-hh-2,w-2,2,col);if(rnd()<.18)R(x+(w>>1),base-hh-8,1,1,'#ff3030');
   for(let wy=base-hh+3;wy<base-4;wy+=3)for(let wx=x+2;wx<x+w-2;wx+=3)if(rnd()<wl)R(wx,wy,1,2,rnd()<.2?hsl(h2,100,65):hsl(50,100,70));
   if(signs&&hh>48&&rnd()<.5){const c=rnd()<.5?hsl(h2,100,62):hsl(h,100,62),sy=base-hh+6+(rnd()*20|0);g.globalAlpha=.25;R(x+w-5,sy-1,5,14,c);g.globalAlpha=1;R(x+w-4,sy,3,12,c);R(x+w-3,sy+2,1,8,'#fff')}
   x+=w+(rnd()*2|0)}}
 city(130,16,50,8,16,hsl(h,45,12+day*6),hsl(h2,70,38),false);
 city(140,30,86,10,22,hsl(h,50,6),hsl(h,90,42),true);
 const tx=44,tb=140,tc=hsl(h,50,4);R(tx-8,tb-40,16,40,tc);R(tx-5,tb-70,10,30,tc);R(tx-2,tb-96,4,26,tc);R(tx-1,tb-110,2,14,tc);
 R(tx-5,tb-70,10,1,hsl(h2,100,60));R(tx-8,tb-40,16,1,hsl(h,100,60));R(tx-1,tb-110,2,1,'#ff3030');
 for(let y=tb-38;y<tb-3;y+=3)for(let x=tx-6;x<tx+6;x+=3)if(rnd()<wl+.15)R(x,y,1,2,hsl(50,100,70));
 for(let i=0;i<9;i++){g.globalAlpha=.05+.02*i;R(0,134+i,W,1,hsl(h,70,45))}g.globalAlpha=1;
 R(0,141,W,60,hsl(h,45,4));R(0,141,W,1,hsl(h,100,60));
 g.globalAlpha=.38;for(const y of [143,146,150,155,161,168,176,185,195])R(0,y,W,1,hsl(h,100,50));
 for(let k=-14;k<=14;k++)for(let y=142;y<196;y++)R(160+k*(5+(y-141)*.75),y,1,1,hsl(h,100,50));g.globalAlpha=1;
 g.restore();const rows=[[148,15,19,hsl(h,38,10)],[162,11,26,hsl(h,38,5)],[178,8,38,hsl(h,38,2)]],V=[ZA,ZB,ZC,ZA];
 const rim=hsl(h2,80,36),eye=hsl(0,100,58);rows.forEach(([by,cnt,gap,col])=>{for(let i=0;i<cnt;i++){const x=Math.round(66+i*gap+rnd()*10),S=V[(rnd()*4)|0],ld=x<CX?1:-1;
  spr(S,x,by,false,col,rim,rnd()<.85?eye:col,ld);
  if(rnd()<.14){const fx=x-2,fy=by-S.length-3;R(fx,fy+3,1,6,'#3a2412');disc(fx,fy,4,hsl(25,100,55),.2);R(fx-1,fy,3,3,hsl(28,100,55));R(fx,fy-1,1,3,hsl(52,100,65))}}});

let PSIG='';
function tintCheck(){const d=new Date(),hr=window.__hr!=null?window.__hr:d.getHours()+d.getMinutes()/60,t=WX?WX.temp:22,c=WX?WX.code:0,rain=(c>=51&&c<=67)||c>=80;

 const day=Math.max(0,Math.min(1,Math.sin((hr-6)/12*Math.PI)*1.3)),dusk=Math.max(0,1-Math.min(Math.abs(hr-6.5),Math.abs(hr-18.7))/1.6);

/* ---------- navegacion (joystick / teclado) ---------- */
const BT=[()=>openOv(),()=>api('/mode/games'),()=>api('/mode/desktop')];let sel=0;
function hl(){BT.forEach((_,i)=>$('b'+i).classList.toggle('on',i===sel))}
function openOv(){$('fr').src='/finanzas.html';$('ov').hidden=false}
function closeOv(){$('ov').hidden=true;$('fr').src='about:blank';SIG='';load()}
function key(k){if(!$('ov').hidden){if(k==='back'||k==='b')closeOv();return}
 const f={left:()=>{sel=(sel+2)%3;hl()},lb:()=>{sel=(sel+2)%3;hl()},right:()=>{sel=(sel+1)%3;hl()},rb:()=>{sel=(sel+1)%3;hl()},ok:()=>BT[sel](),a:()=>BT[sel](),x:()=>openOv(),y:()=>api('/mode/desktop'),start:()=>api('/mode/games')}[k];if(f)f()}
addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',Enter:'ok',' ':'ok',Escape:'back',Backspace:'back'}[e.key];if(m){key(m);e.preventDefault()}});
addEventListener('message',e=>{if(e.data==='close'&&!$('ov').hidden)closeOv()});
[0,1,2].forEach(i=>$('b'+i).onclick=()=>{sel=i;hl();BT[i]()});
let busy=false;async function inbox(){if(busy||paused())return;busy=true;try{let a=await (await fetch('/inbox/pop')).json();a=typeof a==='string'?[a]:arr(a);a.forEach(t=>{if(typeof t==='string'&&t.indexOf('key:')===0)key(t.slice(4))})}catch(e){}busy=false}
/* ---------- ahorro: al volver del juego, se reanuda solo ---------- */

clk();load();wxf();tintCheck();hl();
