.card.on:not(.jump) img{animation:hop .45s steps(5) 1}.card.jump img{animation:jump .7s steps(9) 1}@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-9vh) scale(1.15)}55%{transform:translateY(-2vh)}75%{transform:translateY(-6vh)}100%{transform:translateY(0)}}main{transition:opacity .6s}body.cine main{opacity:.22}.spr{position:fixed;z-index:7;image-rendering:pixelated;pointer-events:none;transform:translateX(-50%);transform-origin:50% 100%}.spr.f{transform:translateX(-50%) scaleX(-1)}.mg.lean{transform:translateX(-50%) rotate(-7deg)}.mg.cast{transform:translateX(-50%) translateX(1.4vh) rotate(6deg) scale(1.05)}.mg.hurtm{transform:translateX(-50%) translateX(-1.6vh) rotate(-9deg);filter:brightness(1.7) saturate(.5)}.mg.win{transform:translateX(-50%) translateY(-2.5vh)}.spr.hit{filter:brightness(2.8) saturate(.3)}.spr.shk{animation:shk .35s steps(6)}.spr.die{animation:die 1s steps(8) forwards}@keyframes die{to{transform:translateX(-50%) scaleX(-1) rotate(80deg) translateY(4vh);opacity:0}}.fb{position:fixed;z-index:8;width:2.8vh;height:2.8vh;background:#fff1a8;box-shadow:0 0 0 .7vh #ffb02e,0 0 0 1.4vh #e8481a,-2.6vh .2vh 0 -.3vh #e8481a,-4.6vh .4vh 0 -.8vh #8a1f0a;pointer-events:none}.fb.big{width:5vh;height:5vh;box-shadow:0 0 0 1.2vh #ffb02e,0 0 0 2.4vh #e8481a,-5vh .4vh 0 -.5vh #e8481a,-8vh .8vh 0 -1.4vh #8a1f0a}.boom{position:fixed;z-index:9;width:7vh;height:7vh;background:#fff1a8;box-shadow:0 0 0 1.4vh #ffb02e,0 0 0 2.8vh #e8481a;transform:translate(-50%,50%);animation:boom .5s steps(5) forwards;pointer-events:none}.yg{position:fixed;z-index:8;width:2.6vh;height:3.2vh;background:linear-gradient(#ff9fd0 0 35%,#fff 35%);border:.4vh solid #d94a96;pointer-events:none}.boom.pk{background:#fff;box-shadow:0 0 0 1.4vh #ffc2e1,0 0 0 2.8vh #ff5fae}.boom.big{width:13vh;height:13vh}@keyframes boom{from{transform:translate(-50%,50%) scale(.3);opacity:1}to{transform:translate(-50%,50%) scale(1.8);opacity:0}}.slash{position:fixed;z-index:8;width:5vh;height:12vh;border:1.2vh solid #ffd9d9;border-right:0;border-radius:100% 0 0 100%/50% 0 0 50%;pointer-events:none;box-shadow:0 0 1.2vh #ff4d4d}.hp{position:fixed;z-index:8;width:16vh;height:1.6vh;border:.4vh solid #fff;background:#2a0a0a;transform:translateX(-50%);pointer-events:none}.hp i{display:block;height:100%;width:100%;background:#e8281a}.dl{position:fixed;z-index:7;image-rendering:pixelated;pointer-events:none;transform:translateX(-50%);transform-origin:50% 100%}.dl.f{transform:translateX(-50%) scaleX(-1)}.dl.shk{animation:shk .35s steps(6)}@keyframes shk{0%,100%{margin-left:0}25%{margin-left:-1.2vh}75%{margin-left:1.2vh}}.bolt{position:fixed;z-index:8;width:5vh;height:1.8vh;pointer-events:none;box-shadow:0 0 1.2vh currentColor,inset 0 0 0 .5vh #fff}.vis{position:fixed;left:0;top:0;z-index:7;height:10vh;image-rendering:pixelated;pointer-events:none;will-change:transform}@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-3vh)}100%{transform:translateY(0)}}

:root{--glass:rgba(12,16,34,.55);--line:rgba(255,255,255,.16)}
body{font-weight:500;letter-spacing:.01em}

#shade{background:radial-gradient(120% 90% at 50% 0%,rgba(0,0,0,0) 30%,rgba(3,5,14,.55) 100%),linear-gradient(180deg,rgba(6,8,22,.15),rgba(6,8,22,.55))}

<img id="bgi" alt=""><div id="shade"></div><div id="scan"></div>
<main>
 <header><div class="ttl"><b>LA HORDA</b><small>CONSOLA DE MANDO</small></div>
  <div class="clk"><div id="clk">--:--</div><div id="dt"></div><div id="wx"></div></div></header>
 <section class="mid">
  <div class="box"><h2>HOY</h2><div id="hoy"></div></div>
  <div class="box"><h2>PENDIENTES <span id="tt"></span></h2><div id="ta"></div></div>
 </section>
 <nav id="nav"></nav>
</main>
<div id="sc" hidden><div id="sct"><b id="sctt"></b><button id="bk" type="button">‹ VOLVER</button></div><div id="cats"></div><div id="its"></div><div id="sch"></div><img id="bighero" alt=""></div>
<div id="ov" hidden><div class="obar"><span id="ovt">CUENTAS Y PENDIENTES</span><span>‹ VOLVER</span></div><iframe id="fr"></iframe></div>
<div id="mas"></div><div id="toast" hidden></div>
<div id="al" hidden><img src="/art/heroes/nahir.png" alt=""><b>ALARMA</b><span id="alh"></span><small id="aln"></small><small>A = APAGAR &nbsp;·&nbsp; B = 10 MIN MAS</small></div>
<script>
const $=id=>document.getElementById(id),api=p=>fetch(p).catch(()=>{});
let WAKE=0;const paused=()=>{const n=performance.now();return n>20000&&n-WAKE>3000&&(document.hidden||!document.hasFocus())};
const ymd=()=>new Date().toLocaleDateString('sv-SE'),fm=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-AR'),
 esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=x=>Array.isArray(x)?x:(x&&Array.isArray(x.value)?x.value:[]);
const hero=n=>'/art/codex/'+n+'.png';
/* ---------- finanzas ---------- */
let FZ={saldos:[],movimientos:[]},TA=[],AL=[],SIG='',PAC=0,PACS=[],AV=null;
async function load(){if(paused())return;try{const [f,t,al,pa,av]=await Promise.all([fetch('/data/finanzas').then(r=>r.json()),fetch('/data/tareas').then(r=>r.json()),fetch('/data/alarmas').then(r=>r.json()),fetch('/data/pacientes').then(r=>r.json()).catch(()=>[]),fetch('/data/avisos').then(r=>r.json()).catch(()=>({}))]);
 const s=JSON.stringify([f,t,al,pa,av,ymd()]);AV=av&&av.mail?av:null;AL=arr(al);PACS=arr(pa).filter(p=>p.estado==='pendiente'&&(p.fecha||'')<=ymd());PAC=PACS.length;if(s===SIG)return;SIG=s;FZ=f||{};FZ.saldos=arr(FZ.saldos);FZ.movimientos=arr(FZ.movimientos);TA=arr(t);draw();buildHome()}catch(e){}}
function dueTxt(v){if(!v)return['',''];const d=Math.round((new Date(v+'T00:00:00')-new Date(ymd()+'T00:00:00'))/864e5);
 return d<0?['VENCIDO','dn']:d===0?['HOY','dn']:d===1?['MAÑANA','cy']:[v.slice(8)+'/'+v.slice(5,7),'dim']}
const ini=n=>String(n||'').split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()+'.').join('');
function draw(){
 const P=TA.filter(x=>!x.hecho).sort((a,b)=>{const o={cobrar:0,pagar:1,tarea:2};return ((o[a.tipo]??2)-(o[b.tipo]??2))||((a.vence||'9')<(b.vence||'9')?-1:1)});
 const TG={cobrar:['COBRAR','#7dffa8'],pagar:['PAGAR','#ff6b6b'],tarea:['TAREA','#ffb454']};
 const rows=P.map(x=>{const t=TG[x.tipo]||TG.tarea,d=dueTxt(x.vence);return{tag:t[0],col:t[1],txt:x.texto,due:d}}).concat(PACS.map(p=>({tag:'PACIENTE',col:'#7ad7ff',txt:ini(p.nombre)+(p.motivo?' · '+p.motivo:''),due:dueTxt(p.fecha)})));
 $('tt').innerHTML='';
 $('ta').innerHTML=rows.length?rows.slice(0,5).map(r=>'<div class="r"><span class="tag" style="color:'+r.col+'">'+r.tag+'</span><span class="n">'+esc(r.txt)+'</span><span class="'+r.due[1]+'">'+r.due[0]+'</span></div>').join('')+(rows.length>5?'<div class="dim">+'+(rows.length-5)+' mas</div>':''):'<div class="emp">SIN PENDIENTES<br>TODO AL DIA</div>';
 hoy()}
const alTxt=x=>(x.t.toDateString()===new Date().toDateString()?'hoy ':(x.t.toDateString()===new Date(Date.now()+864e5).toDateString()?'manana ':DN[x.t.getDay()]+' '))+x.a.hora;
function hoy(){const w=WX,n=nextAl();let h='';
 if(w){h+='<div class="r tot"><span class="n">'+Math.round(w.temp)+'° '+wc(w.code)+'</span><span class="dim" style="font-size:3.4vh">viento '+Math.round(w.wind)+' km/h</span></div><div class="fc">'+(w.days||[]).slice(0,4).map((d,i)=>'<div><b>'+(i?DN[(new Date().getDay()+i)%7].toUpperCase():'HOY')+'</b><span>'+Math.round(d.max)+'°/'+Math.round(d.min)+'°</span><small>'+(d.rain>=40?'lluvia '+d.rain+'%':wc(d.code))+'</small></div>').join('')+'</div>'}

 if(AV&&AV.mail){(AV.mail.alertas||[]).slice(0,2).forEach(a=>{h+='<div class="r"><span class="n dn">'+esc(a)+'</span></div>'});h+='<div class="r"><span class="n">Mail importante sin leer</span><b>'+AV.mail.importantes+'</b></div>'}
 if(DL.length)h+='<div class="r"><span class="n">Steam bajando</span><b>'+esc(DL[0].name.slice(0,14))+' '+DL[0].pct+'%</b></div>';
