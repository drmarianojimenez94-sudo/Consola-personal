<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Planilla de pacientes</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--c:#00f5e0;--m:#ff2bb4;--line:rgba(120,255,240,.22)}
*{box-sizing:border-box}
body{margin:0;background:#04050d;color:#d8fffb;font:1.9vh/1.35 "Segoe UI",system-ui,sans-serif;padding:2.5vh 2.5vw 6vh}
h1{font-size:3vh;letter-spacing:.3em;margin:0 0 1vh}h1 span{color:var(--c)}
.bar{display:flex;gap:1vw;flex-wrap:wrap;align-items:center;margin-bottom:1.6vh}
button,input,select{font:inherit;color:#eaffff;background:#0b1030;border:1px solid var(--line);border-radius:1vh;padding:.7vh .7vw}
button{cursor:pointer;border-color:var(--c)}button.d{border-color:#ff5d7a;color:#ff5d7a;padding:.3vh .6vw}
table{border-collapse:collapse;width:100%}
th{font-size:1.4vh;letter-spacing:.15em;color:var(--m);text-align:left;padding:.6vh .4vw;white-space:nowrap}
td{padding:.3vh .2vw;vertical-align:top;border-top:1px solid #ffffff10}
td input,td select{width:100%;min-width:7vw;background:transparent;border-color:#ffffff14}
td input:focus,td select:focus{outline:2px solid var(--c);background:#0b1030}
.est-p{color:#ffd24d}.est-a{color:#4dff9d}
.det{background:#0b1030;border-radius:1vh;padding:1vh 1vw;font-size:1.7vh}
.det div{margin:.4vh 0}.dim{opacity:.65}
#msg{color:#4dff9d}
</style></head><body>
<h1>PLANILLA DE <span>PACIENTES</span></h1>
<div class="bar"><button id="add">+ Paciente</button><input id="q" placeholder="Buscar…"><select id="f"><option value="">Todos</option><option value="pendiente">Pendientes</option><option value="atendido">Atendidos</option></select>
<button id="csv">Exportar a Excel (CSV)</button><button id="fold">Abrir carpeta de historias</button><button id="hc">Nueva historia clínica</button><span id="msg"></span></div>
<table><thead><tr><th>PACIENTE</th><th>DNI</th><th>TELÉFONO</th><th>OBRA SOCIAL</th><th>NACIMIENTO</th><th>TURNO</th><th>MOTIVO</th><th>ESTADO</th><th>ÚLT. CONSULTA</th><th>HC</th><th>NOTAS</th><th></th></tr></thead><tbody id="tb"></tbody></table>
<script>
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE');let D=[],t=null;
async function load(){try{D=await (await fetch('/data/pacientes')).json()}catch(e){D=[]}draw()}
function save(){clearTimeout(t);t=setTimeout(async()=>{try{await fetch('/data/pacientes',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(D)});$('msg').textContent='✔ guardado';setTimeout(()=>$('msg').textContent='',1500)}catch(e){$('msg').textContent='Error al guardar'}},400)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=[['nombre','text'],['dni','text'],['telefono','text'],['obraSocial','text'],['nacimiento','date'],['fecha','date'],['motivo','text']];
function draw(){const q=$('q').value.toLowerCase(),f=$('f').value;const rows=D.filter(p=>(!f||p.estado===f)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));
 $('tb').innerHTML=rows.map(p=>{const i=D.indexOf(p);return '<tr data-i="'+i+'">'+F.map(([k,ty])=>'<td><input data-k="'+k+'" type="'+ty+'" value="'+esc(p[k])+'"></td>').join('')+
  '<td><select data-k="estado"><option value="pendiente"'+(p.estado==='pendiente'?' selected':'')+'>pendiente</option><option value="atendido"'+(p.estado==='atendido'?' selected':'')+'>atendido</option></select></td>'+
  '<td class="dim">'+esc(p.ultimaConsulta||'')+'</td><td><button class="x">'+((p.consultas||[]).length)+' ▾</button></td><td><input data-k="notas" value="'+esc(p.notas)+'"></td><td><button class="d">✕</button></td></tr>'+
  '<tr class="dt" style="display:none"><td colspan="12"><div class="det">'+((p.consultas||[]).map(c=>'<div><b>'+esc(c.fecha)+'</b> · '+esc(c.motivo)+' → <i>'+esc(c.diagnostico)+'</i> · plan: '+esc(c.plan)+' <span class="dim">('+esc(c.archivo)+')</span></div>').join('')||'<span class="dim">Sin consultas registradas</span>')+'</div></td></tr>'}).join('')}
$('tb').addEventListener('input',e=>{const tr=e.target.closest('tr'),k=e.target.dataset.k;if(!k)return;D[+tr.dataset.i][k]=e.target.value;save()});
$('tb').addEventListener('change',e=>{if(e.target.dataset.k==='estado')draw()});
$('tb').addEventListener('click',e=>{const tr=e.target.closest('tr');if(e.target.classList.contains('x'))tr.nextElementSibling.style.display=tr.nextElementSibling.style.display==='none'?'':'none';
 if(e.target.classList.contains('d')&&confirm('¿Borrar a '+(D[+tr.dataset.i].nombre||'este paciente')+'?')){D.splice(+tr.dataset.i,1);save();draw()}});
$('add').onclick=()=>{D.unshift({id:Math.random().toString(36).slice(2,10),nombre:'',dni:'',telefono:'',obraSocial:'',nacimiento:'',fecha:today(),motivo:'',estado:'pendiente',notas:'',consultas:[]});draw();document.querySelector('#tb input')?.focus();save()};
$('q').oninput=draw;$('f').onchange=draw;
$('fold').onclick=()=>fetch('/launch/pacientes');$('hc').onclick=()=>fetch('/open/hc');
$('csv').onclick=()=>{const h=['Paciente','DNI','Telefono','Obra social','Nacimiento','Turno','Motivo','Estado','Ultima consulta','Consultas','Notas'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const l=[h.map(q).join(';')].concat(D.map(p=>[p.nombre,p.dni,p.telefono,p.obraSocial,p.nacimiento,p.fecha,p.motivo,p.estado,p.ultimaConsulta,(p.consultas||[]).length,p.notas].map(q).join(';')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+l.join('\r\n')],{type:'text/csv'}));a.download='pacientes_'+today()+'.csv';a.click()};
load();
</script></body></html>
