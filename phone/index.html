<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Neon Remote</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
<style>
:root{--c:#00f5e0;--m:#ff2bb4;--g:#4dff9d;--b:#ff5d7a;--bg:#05060f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:#e8fffb;font-family:system-ui,"Segoe UI",sans-serif;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% -10%,#2a1560 0,#05060f 62%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 10px);max-width:480px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px}
.rem{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.sw{width:52px;height:30px;border-radius:16px;background:#2a3a6a;position:relative;transition:.2s;border:1px solid #3a4a8a}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g);border-color:var(--g)}.sw.on::after{left:25px}
#dot{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}#dot i{width:11px;height:11px;border-radius:50%;background:#666;box-shadow:0 0 8px #666}#dot.ok i{background:var(--g);box-shadow:0 0 10px var(--g)}#dot.bad i{background:var(--b);box-shadow:0 0 10px var(--b)}
#pin{display:none;flex-direction:column;gap:10px;background:#0e1230;border:1px solid var(--m);border-radius:18px;padding:14px;margin-bottom:8px}
#pin input{width:100%;padding:15px;border-radius:14px;border:1px solid #2a3a6a;background:#070a1e;color:#fff;font-size:22px;letter-spacing:.3em;text-align:center;user-select:text;-webkit-user-select:text}
button{font:inherit;color:#fff;border:1px solid #2a3a6a;background:#141a44;border-radius:22px}
button:active,button.dn{background:var(--m);border-color:#fff;transform:scale(.95)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
/* cruceta con el microfono en el centro */
.wheel{position:relative;width:min(88vw,380px);aspect-ratio:1;margin:auto}
.wheel .arr{position:absolute;width:30%;height:30%;font-size:34px;border-radius:26px;display:grid;place-items:center}
.wheel .u{top:0;left:35%}.wheel .d{bottom:0;left:35%}.wheel .l{left:0;top:35%}.wheel .r{right:0;top:35%}
#mic{position:absolute;left:25%;top:25%;width:50%;height:50%;border-radius:50%;border:3px solid var(--m);background:radial-gradient(circle at 35% 30%,#ff2bb4,#8a6bff);font-size:15px;font-weight:800;letter-spacing:.06em;display:grid;place-items:center;text-align:center;line-height:1.2;box-shadow:0 0 28px #ff2bb466}
#mic .ic{font-size:44px;line-height:1}
#mic.on{animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 60px var(--m);transform:scale(1.05)}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acts button{padding:26px 6px;font-size:22px;font-weight:800;letter-spacing:.08em}
#back{border-color:var(--b);color:var(--b)}#enter{border-color:var(--g);color:var(--g);background:#0a2a22}
#heard{min-height:26px;text-align:center;color:var(--c);font-size:17px}
#st{font-size:12px;min-height:16px;opacity:.85;text-align:center}
details{margin-top:6px;border:1px solid #1c2a5a;border-radius:16px;padding:10px 12px;background:#0b0f2a}
summary{font-size:13px;opacity:.8}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.row button{padding:12px 4px;font-size:14px;border-radius:14px}
#pad{height:150px;margin-top:10px;border:2px solid #2a3a6a;border-radius:16px;background:repeating-linear-gradient(0deg,#0b1030,#0b1030 22px,#0e1540 22px,#0e1540 23px);touch-action:none;display:grid;place-items:center;font-size:12px;color:#8fa0c8;text-align:center}
input.t{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid #2a3a6a;background:#070a1e;color:#fff;font-size:16px;user-select:text;-webkit-user-select:text}
</style></head><body>
<header><div class="rem" onclick="toggleRem()"><div class="sw" id="sw"></div><span>Recordarme</span></div><div id="dot"><i></i><span id="dt">sin vincular</span></div></header>
<div id="pin"><div>Ingres&aacute; el PIN que muestra la TV (arriba a la derecha)</div><input id="pinIn" inputmode="numeric" maxlength="6" placeholder="••••••"><button onclick="savePin()" style="padding:14px;font-size:17px">Vincular</button></div>
<main>
 <div id="heard"></div>
 <div class="wheel">
  <button class="arr u" data-k="up" data-rep>&#9650;</button><button class="arr l" data-k="left" data-rep>&#9664;</button><button class="arr r" data-k="right" data-rep>&#9654;</button><button class="arr d" data-k="down" data-rep>&#9660;</button>
  <button id="mic" onclick="toggleMic()"><span><span class="ic">&#127908;</span><br>VOZ</span></button>
 </div>
 <div class="acts"><button id="back" data-k="back">VOLVER</button><button id="enter" data-k="ok">ENTRAR</button></div>
 <div id="st">&nbsp;</div>
</main>
<details><summary>M&aacute;s: mouse, teclado y ubicaci&oacute;n</summary>
 <div id="pad">TOUCHPAD<br>deslizar = mover &middot; tocar = clic &middot; 2 dedos = clic derecho / scroll</div>
 <div class="row"><button onclick="send('click:left')">Clic</button><button onclick="send('click:right')">Derecho</button><button onclick="send('pckey:esc')">Esc</button><button onclick="send('pckey:enter')">Enter</button></div>
 <input class="t" id="txt" placeholder="Escribir en la PC u orden a la consola" enterkeyhint="send" autocomplete="off">
 <div class="row"><button onclick="sendTxt('type')">Escribir</button><button onclick="sendTxt('cmd')">Orden</button><button id="locb" onclick="toggleLoc()">&#128205; OFF</button></div>
</details>
<script>
const $=id=>document.getElementById(id);
let rem=(localStorage.getItem('rem')??'0')==='1';
let pin=(rem?localStorage.getItem('pin'):sessionStorage.getItem('pin'))||localStorage.getItem('pin')||'';
function paintRem(){$('sw').classList.toggle('on',rem)}
function toggleRem(){rem=!rem;localStorage.setItem('rem',rem?'1':'0');paintRem();if(pin){if(rem){localStorage.setItem('pin',pin)}else{localStorage.removeItem('pin');sessionStorage.setItem('pin',pin)}}vib(10)}
paintRem();
function setSt(t,bad){$('st').textContent=t;$('st').style.color=bad?'#ff5d7a':''}
function dot(ok,t){const d=$('dot');d.className=ok?'ok':'bad';$('dt').textContent=t}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n||12)}catch(e){}}
async function send(t,quiet){if(!pin){$('pin').style.display='flex';return false}
 try{const r=await fetch('/cmd?pin='+encodeURIComponent(pin)+'&t='+encodeURIComponent(t),{cache:'no-store'});const j=await r.json();
  if(!j.ok){dot(false,j.err||'error');setSt(j.err||'error',1);if(r.status===403){localStorage.removeItem('pin');sessionStorage.removeItem('pin');pin='';$('pin').style.display='flex'}return false}
  dot(true,'conectado');if(!quiet)setSt('→ '+t);return true}catch(e){dot(false,'sin conexión');setSt('Sin conexión con la PC',1);return false}}
async function savePin(){const v=$('pinIn').value.trim();try{const r=await fetch('/check?pin='+encodeURIComponent(v));if(r.ok){pin=v;if(rem){localStorage.setItem('pin',v)}else{sessionStorage.setItem('pin',v)}$('pin').style.display='none';dot(true,'conectado');setSt('Vinculado')}else{setSt('PIN incorrecto',1)}}catch(e){setSt('Sin conexión',1)}}
if(!pin){$('pin').style.display='flex'}else{send('key:ping',true)}
setInterval(()=>{if(pin)send('key:ping',true)},15000);
// botones: cruceta (mantener = repetir), volver, entrar
document.querySelectorAll('[data-k]').forEach(b=>{let iv=null;const k=b.dataset.k,fire=()=>{vib();send('key:'+k,true)};
 const dn=e=>{e.preventDefault();b.classList.add('dn');fire();if(b.hasAttribute('data-rep')){iv=setTimeout(()=>{iv=setInterval(fire,170)},350)}},up=()=>{b.classList.remove('dn');clearTimeout(iv);clearInterval(iv);iv=null};
 b.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
// voz
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false;
function toggleMic(){if(!SR){setSt('Sin dictado en este navegador: usá el micrófono del teclado en "Más"',1);return}
 if(on){rec.stop();return}rec=new SR();rec.lang='es-AR';rec.interimResults=true;
 rec.onstart=()=>{on=true;$('mic').classList.add('on');$('heard').textContent='escuchando...';vib(20)};
 rec.onend=()=>{on=false;$('mic').classList.remove('on')};
 rec.onerror=e=>setSt(e.error==='not-allowed'?'Permiso de micrófono denegado: tocá el candado del navegador':'Voz: '+e.error,1);
 rec.onresult=e=>{const r=e.results[e.results.length-1],t=r[0].transcript;$('heard').textContent='“'+t+'”';if(r.isFinal)send(t)};try{rec.start()}catch(e){}}
// mas: mouse, teclado, ubicacion
(function(){const p=$('pad');let last=null,acc={x:0,y:0},tapT=0,moved=0,fingers=0,sc=0;
 setInterval(()=>{const dx=Math.round(acc.x*2.5),dy=Math.round(acc.y*2.5);if(dx||dy){send('mouse:'+dx+','+dy,true);acc.x=acc.y=0}},45);
 p.addEventListener('touchstart',e=>{e.preventDefault();fingers=e.touches.length;last=[...e.touches].map(t=>[t.clientX,t.clientY]);moved=0;tapT=Date.now()},{passive:false});
 p.addEventListener('touchmove',e=>{e.preventDefault();const ts=[...e.touches];if(ts.length===1&&last){const dx=ts[0].clientX-last[0][0],dy=ts[0].clientY-last[0][1];acc.x+=dx;acc.y+=dy;moved+=Math.abs(dx)+Math.abs(dy)}else if(ts.length>=2&&last&&last[0]){const dy=ts[0].clientY-last[0][1];sc+=dy;moved+=Math.abs(dy);if(Math.abs(sc)>14){send('scroll:'+(sc>0?-2:2),true);sc=0}}last=ts.map(t=>[t.clientX,t.clientY])},{passive:false});
 p.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length===0){if(Date.now()-tapT<260&&moved<12){send(fingers>=2?'click:right':'click:left',true);vib(15)}fingers=0;last=null}else last=[...e.touches].map(t=>[t.clientX,t.clientY])},{passive:false})})();
function sendTxt(m){const v=$('txt').value;if(!v.trim())return;send((m==='type'?'type:':'')+v);$('txt').value=''}
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendTxt('cmd')});
let locOn=localStorage.getItem('loc')==='1',locT=null;
function sendLoc(){if(!navigator.geolocation||!pin)return;navigator.geolocation.getCurrentPosition(p=>send('loc:'+p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)+','+Math.round(p.coords.accuracy),true),e=>setSt('Ubicación: '+(e.code===1?'permiso denegado':'no disponible'),1),{timeout:15000,maximumAge:60000})}
function paintLoc(){$('locb').innerHTML='&#128205; '+(locOn?'ON':'OFF');$('locb').style.borderColor=locOn?'#4dff9d':'#2a3a6a'}
function toggleLoc(){locOn=!locOn;localStorage.setItem('loc',locOn?'1':'0');paintLoc();clearInterval(locT);if(locOn){sendLoc();locT=setInterval(sendLoc,300000)}}
paintLoc();if(locOn){setTimeout(sendLoc,1500);locT=setInterval(sendLoc,300000)}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
</script></body></html>
